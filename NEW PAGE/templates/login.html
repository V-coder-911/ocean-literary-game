{% extends "base.html" %}

{% block title %}OceanQuest - Sign In{% endblock %}

{% block content %}
<div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 75vh;">
    <div class="auth-container glass-card" style="width: 100%;">
        <div class="auth-header">
            <h2>WELCOME BACK</h2>
            <p>Access your Ocean Guardian dashboard</p>
        </div>
        
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username or Email</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username or email" required>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <div class="form-group" style="flex-direction: row; justify-content: space-between; align-items: center; margin-top: 10px;">
                <label class="remember-me">
                    <input type="checkbox" name="remember_me">
                    <span>Remember me</span>
                </label>
            </div>
            
            <button type="submit" class="btn-glow" style="width: 100%; margin-top: 20px;">
                <i class="fa-solid fa-right-to-bracket"></i> SIGN IN
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 25px; border-top: 1px solid rgba(0, 180, 216, 0.15); padding-top: 20px;">
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">New to OceanQuest?</p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <a href="{{ url_for('register') }}" class="btn-secondary" style="width: 100%;">
                    <i class="fa-solid fa-user-plus"></i> CREATE ACCOUNT
                </a>
                <a href="{{ url_for('login') }}?guest=1" class="btn-secondary" style="width: 100%; border-color: var(--color-safe); color: var(--color-safe) !important;">
                    <i class="fa-solid fa-user-secret"></i> PLAY AS GUEST
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
