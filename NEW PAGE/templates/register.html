{% extends "base.html" %}

{% block title %}OceanQuest - Create Account{% endblock %}

{% block content %}
<div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 75vh;">
    <div class="auth-container glass-card" style="width: 100%; max-width: 500px; margin: 40px auto;">
        <div class="auth-header">
            <h2>START YOUR JOURNEY</h2>
            <p>Become an Ocean Guardian today</p>
        </div>
        
        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label for="name"><i class="fa-solid fa-signature"></i> Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required>
            </div>
            
            <div class="grid-2" style="gap: 15px; margin-bottom: 20px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="age_group"><i class="fa-solid fa-child"></i> Age / User Group</label>
                    <select id="age_group" name="age_group" class="form-control" required>
                        <option value="" disabled selected>Select Group</option>
                        <option value="Child/Student">Student / Child</option>
                        <option value="Adult">Adult</option>
                        <option value="Fisherman">Fisherman</option>
                        <option value="Tourist">Tourist</option>
                        <option value="General">General User</option>
                    </select>
                </div>
                
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="language"><i class="fa-solid fa-language"></i> Language</label>
                    <select id="language" name="language" class="form-control" required>
                        <option value="English">English</option>
                        <option value="Hindi">Hindi (हिन्दी)</option>
                        <option value="Tamil">Tamil (தமிழ்)</option>
                        <option value="Malayalam">Malayalam (മലയാളം)</option>
                        <option value="Marathi">Marathi (मराठी)</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" class="btn-glow" style="width: 100%; margin-top: 10px;">
                <i class="fa-solid fa-user-plus"></i> CREATE ACCOUNT
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 25px; border-top: 1px solid rgba(0, 180, 216, 0.15); padding-top: 20px;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary-cyan); text-decoration: none; font-weight: 600;">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
